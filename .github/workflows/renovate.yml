# Runs Renovate on this repository once a day.
# Renovate reads its configuration from renovate.json5 in the root.
# The token comes from a GitHub App that is installed on this repository only.
name: Renovate

on:
  schedule:
    # 01:17 UTC every day. A run takes about 10 minutes of Actions time.
    # GitHub can start a scheduled run up to about an hour late.
    # The run must start before 04:00 UTC on Monday, because lock file
    # maintenance in renovate.json5 has the schedule "before 4am on monday".
    - cron: "17 1 * * *"
  # Adds the "Run workflow" button on the Actions tab.
  workflow_dispatch:

# Renovate uses the token of the GitHub App, not GITHUB_TOKEN, so the job needs no
# GITHUB_TOKEN permissions.
permissions: {}

# A new run waits until the previous run is finished.
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Makes an installation token for the GitHub App. The token is valid for one hour.
      # The action revokes the token when the job ends.
      - name: Create a token for the GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          # The action accepts the App ID or the Client ID of the app here.
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.14
        with:
          # The same Renovate version as the examples.
          renovate-version: 44.258.1
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Renovate compares the author of each commit on a branch with RENOVATE_GIT_AUTHOR
          # and RENOVATE_GIT_IGNORED_AUTHORS. Another author means that a person changed the
          # branch, and then Renovate stops updating and merging it.
          # The old branches have commits from the PAT user Susling.
          RENOVATE_GIT_AUTHOR: "Susling <18191356+Susling@users.noreply.github.com>"
          # With a GitHub App token, Renovate makes its commits through the GitHub API
          # (platformCommit "auto"). GitHub writes the app as the author of these commits.
          RENOVATE_GIT_IGNORED_AUTHORS: "360128416+susling-renovate-bot[bot]@users.noreply.github.com"
          # The open Renovate PRs and the Dependency Dashboard were opened with a PAT of
          # the user Susling. Without this option, Renovate looks only at PRs and issues
          # of the GitHub App, so it does not find them.
          RENOVATE_IGNORE_PR_AUTHOR: "true"
          LOG_LEVEL: info
