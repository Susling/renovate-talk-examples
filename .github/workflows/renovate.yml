# Runs Renovate on this repository every hour.
# Renovate reads its configuration from renovate.json5 in the root.
# The token comes from a GitHub App that is installed on this repository only.
name: Renovate

on:
  schedule:
    # Minute 0 of every hour, in UTC. GitHub can start a scheduled run some minutes late.
    - cron: "0 * * * *"
  # Adds the "Run workflow" button on the Actions tab.
  workflow_dispatch:

# Renovate uses the token of the GitHub App, not GITHUB_TOKEN, so the job needs no
# GITHUB_TOKEN permissions.
permissions: {}

# A new run waits until the previous run is finished.
concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Makes an installation token for the GitHub App. The token is valid for one hour.
      # The action revokes the token when the job ends.
      - name: Create a token for the GitHub App
        id: app-token
        uses: actions/create-github-app-token@v3.4.0
        with:
          # The action accepts the App ID or the Client ID of the app here.
          client-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}

      - name: Self-hosted Renovate
        uses: renovatebot/github-action@v46.3.14
        with:
          # The same Renovate version as the examples and run-renovate.sh.
          renovate-version: 44.247.1
          token: ${{ steps.app-token.outputs.token }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # The commits keep this author. Renovate compares the author of the last commit
          # on a branch with this value. Another author means that a person changed the
          # branch, and then Renovate stops updating it.
          RENOVATE_GIT_AUTHOR: "Susling <18191356+Susling@users.noreply.github.com>"
          # The open Renovate PRs and the Dependency Dashboard were opened with a PAT of
          # the user Susling. Without this option, Renovate looks only at PRs and issues
          # of the GitHub App, so it does not find them.
          RENOVATE_IGNORE_PR_AUTHOR: "true"
          LOG_LEVEL: info
